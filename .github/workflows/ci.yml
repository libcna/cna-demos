# Builds cna-demos against the pinned CNA revision with the windowless renderers
# (SOFTWARE/HEADLESS/STUB) and runs the CLI tests and every demo on SOFTWARE.
# A private Xvfb supplies platform display services; no GPU is needed.
# See docs/AUTOMATION.md section 6.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The exact CNA and sharp-runtime commits cna-demos is built and tested against
  # (HANDOFF.md "Dependencies"). The demos follow CNA next's current API (CNA 0.2.0, C ABI
  # 0.60.0), so an older CNA no longer compiles them.
  CNA_REF: a8adc79c1206773fdb0cacac1278472f72f35059             # CNA next
  SHARP_RUNTIME_REF: 0abe8a91205093e2288a6473562446d8b2d48adf   # sharp-runtime next

jobs:
  windowless:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out cna-demos
        uses: actions/checkout@v4
        with:
          path: cna-demos

      - name: Check out CNA
        uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: ${{ env.CNA_REF }}
          path: cna

      - name: Check out sharp-runtime
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: ${{ env.SHARP_RUNTIME_REF }}
          path: sharp-runtime

      - name: CNA submodules
        # The avatar catalogs (cna-avatar-assets) are a submodule since CNA 56d5d8202; CNA's
        # gamer-services module refuses to configure without them.
        run: |
          git -C cna submodule update --init --depth 1 third_party/SDL third_party/SDL_mixer \
            third_party/draco modules/gamer-services/assets/avatars

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config ccache g++-14 xvfb xauth \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libcurl4-openssl-dev nlohmann-json3-dev libzstd-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev \
            libxss-dev libxtst-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libgl1-mesa-dev libegl-dev libasound2-dev libpulse-dev

      - name: Configure
        working-directory: cna-demos
        run: cmake --preset windowless -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        working-directory: cna-demos
        run: cmake --build --preset windowless -j4

      - name: Validate the registry
        working-directory: cna-demos
        run: build/windowless/bin/cna-demos --validate

      - name: Test
        working-directory: cna-demos
        env:
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          SDL_VIDEO_DRIVER=x11 env -u WAYLAND_DISPLAY \
            xvfb-run -a -s '-screen 0 1280x1024x24' ctest --preset windowless

      - name: Smoke run report and catalog
        if: always()
        working-directory: cna-demos
        env:
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
          SDL_AUDIO_DRIVER: dummy
        run: |
          SDL_VIDEO_DRIVER=x11 env -u WAYLAND_DISPLAY \
            xvfb-run -a -s '-screen 0 1280x1024x24' \
            build/windowless/bin/cna-demos --smoke --quiet --renderer SOFTWARE \
              --report results-software.json || true
          build/windowless/bin/cna-demos --catalog-json > catalog.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cna-demos-results
          path: |
            cna-demos/results-software.json
            cna-demos/catalog.json
